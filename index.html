<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<meta name="description" content="Snap. Snap. Loop. Take a few photos, get a GIF.">
<title>loopshot</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="loopshot">
<style>
  :root {
    --bg: #000;
    --fg: #fff;
    --dim: rgba(255,255,255,.55);
    --glass: rgba(255,255,255,.12);
    --glass-2: rgba(255,255,255,.2);
    --accent: #ffd23f;
    --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
    --ease-drawer: cubic-bezier(0.32, 0.72, 0, 1);
    --sat: env(safe-area-inset-top, 0px);
    --sab: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  /* lock the page: no rubber-banding, no pinch, no selection, no callouts */
  html, body {
    position: fixed; inset: 0;
    width: 100%; height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: none;
    background: var(--bg); color: var(--fg);
    font: 500 15px/1.3 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    -webkit-text-size-adjust: 100%;
  }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; touch-action: manipulation; }
  button:focus-visible, [role=slider]:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

  #app {
    position: fixed; inset: 0;
    display: grid;
    grid-template-rows: auto 1fr auto;
    padding: calc(var(--sat) + 8px) 16px calc(var(--sab) + 16px);
  }

  /* top bar */
  .top { height: 44px; display: flex; align-items: center; justify-content: space-between; }
  .chip {
    height: 36px; min-width: 36px; padding: 0 12px; border-radius: 18px;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    background: var(--glass);
    -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
    transition: transform 160ms var(--ease-out), opacity 200ms ease;
  }
  .chip:active { transform: scale(0.94); }
  .chip svg { width: 18px; height: 18px; }
  .chip[hidden] { display: inline-flex; opacity: 0; pointer-events: none; }
  .brand { font-weight: 700; letter-spacing: -.01em; font-size: 17px; }
  .brand b { color: var(--accent); }

  /* viewfinder */
  .stage { position: relative; display: grid; place-items: center; min-height: 0; }
  .finder {
    position: relative;
    aspect-ratio: 3 / 4;
    max-width: 100%; max-height: 100%;
    width: 100%;
    border-radius: 22px; overflow: hidden;
    background: #111;
  }
  @supports not (aspect-ratio: 3/4) { .finder { height: 0; padding-top: 133.33%; } }
  .finder video {
    position: absolute; inset: 0; width: 100%; height: 100%;
    object-fit: cover;
  }
  .finder video.mirror { transform: scaleX(-1); }
  .flash {
    position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none;
    transition: opacity 260ms var(--ease-out);
  }
  .flash.on { opacity: .85; transition: none; }
  .gate {
    position: absolute; inset: 0; display: grid; place-content: center; gap: 14px;
    text-align: center; padding: 24px;
    background: radial-gradient(120% 80% at 50% 0%, #1d1d1f 0%, #000 70%);
    transition: opacity 300ms ease;
  }
  .gate.gone { opacity: 0; pointer-events: none; }
  .gate h1 { font-size: 30px; letter-spacing: -.02em; line-height: 1.05; }
  .gate p { color: var(--dim); font-size: 14px; max-width: 26ch; margin: 0 auto; }
  .gate .go {
    justify-self: center; margin-top: 6px;
    height: 46px; padding: 0 22px; border-radius: 23px;
    background: var(--fg); color: #000; font-weight: 600;
    transition: transform 160ms var(--ease-out);
  }
  .gate .go:active { transform: scale(0.96); }
  .gate .go[hidden] { display: none; }
  .hint {
    position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%);
    padding: 6px 12px; border-radius: 14px; font-size: 13px; white-space: nowrap;
    background: rgba(0,0,0,.45); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px);
    transition: opacity 200ms ease;
  }

  /* bottom controls */
  .bar {
    height: 104px; padding-top: 14px;
    display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
  }
  .stack { justify-self: start; position: relative; width: 56px; height: 56px; }
  .stack .thumb {
    position: absolute; inset: 0; border-radius: 12px; overflow: hidden;
    background: #222 center / cover no-repeat;
    border: 2px solid rgba(255,255,255,.9);
    transition: transform 260ms var(--ease-out), opacity 260ms var(--ease-out);
  }
  .stack .thumb:nth-last-child(2) { transform: rotate(-8deg) translate(-3px, 1px) scale(.94); opacity: .7; }
  .stack .thumb:nth-last-child(3) { transform: rotate(8deg) translate(3px, 1px) scale(.88); opacity: .4; }
  .stack .thumb:nth-last-child(n+4) { opacity: 0; }
  .stack .thumb.enter { transform: scale(.6) translateY(-30px); opacity: 0; }
  .count {
    position: absolute; top: -8px; right: -8px; z-index: 5;
    min-width: 24px; height: 24px; padding: 0 7px; border-radius: 12px;
    background: var(--accent); color: #000; font-size: 13px; font-weight: 700;
    display: grid; place-items: center;
    font-variant-numeric: tabular-nums;
    transition: transform 200ms var(--ease-out), opacity 200ms ease;
  }
  .count.empty { transform: scale(.5); opacity: 0; }
  .count.bump { animation: bump 240ms var(--ease-out); }
  @keyframes bump { 40% { transform: scale(1.25); } }

  .shutter {
    width: 80px; height: 80px; border-radius: 50%;
    border: 4px solid #fff; padding: 4px;
    display: grid; place-items: center;
  }
  .shutter i {
    display: block; width: 100%; height: 100%; border-radius: 50%; background: #fff;
    transition: transform 140ms var(--ease-out);
  }
  .shutter:active i { transform: scale(0.88); }
  .shutter:disabled { opacity: .35; }

  .side { justify-self: end; position: relative; width: 56px; height: 56px; }
  .side > button {
    position: absolute; inset: 0; border-radius: 50%;
    display: grid; place-items: center;
    transition: transform 240ms var(--ease-out), opacity 200ms ease, filter 200ms ease;
  }
  .side > button:active { transform: scale(0.92); }
  .side svg { width: 26px; height: 26px; }
  .flip { background: var(--glass); }
  .done { background: var(--accent); color: #000; }
  .done svg path { stroke-dasharray: 30; stroke-dashoffset: 30; transition: stroke-dashoffset 360ms 80ms var(--ease-out); }
  .side.ready .done svg path { stroke-dashoffset: 0; }
  .side:not(.ready) .done { transform: scale(.8); opacity: 0; filter: blur(4px); pointer-events: none; }
  .side.ready .flip { transform: scale(.8); opacity: 0; filter: blur(4px); pointer-events: none; }

  /* review sheet */
  .sheet {
    position: fixed; inset: 0; z-index: 10;
    display: grid; grid-template-rows: auto 1fr auto;
    padding: calc(var(--sat) + 8px) 16px calc(var(--sab) + 16px);
    background: #0b0b0c;
    transform: translateY(100%);
    transition: transform 420ms var(--ease-drawer);
    visibility: hidden;
  }
  .sheet.open { transform: translateY(0); visibility: visible; }
  .sheet.closing { visibility: visible; }
  .preview { position: relative; display: grid; place-items: center; min-height: 0; padding: 4px 0 14px; }
  .preview .frame {
    position: relative; aspect-ratio: 3/4; max-height: 100%; max-width: 100%; height: 100%;
    border-radius: 18px; overflow: hidden; background: #161617;
  }
  .preview img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; -webkit-touch-callout: default; }
  .busy {
    position: absolute; inset: 0; display: grid; place-items: center;
    background: rgba(0,0,0,.35); opacity: 0; transition: opacity 160ms ease; pointer-events: none;
  }
  .busy.on { opacity: 1; }
  .busy i {
    width: 28px; height: 28px; border-radius: 50%;
    border: 3px solid rgba(255,255,255,.25); border-top-color: #fff;
    animation: spin 600ms linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .meta {
    position: absolute; left: 10px; bottom: 10px; padding: 4px 9px; border-radius: 10px;
    background: rgba(0,0,0,.5); font-size: 12px; color: rgba(255,255,255,.85);
    font-variant-numeric: tabular-nums;
  }

  .controls { display: grid; gap: 14px; }
  .row { display: grid; gap: 8px; }
  .row .lab { display: flex; justify-content: space-between; font-size: 13px; color: var(--dim); }
  .row .lab span:last-child { color: var(--fg); font-variant-numeric: tabular-nums; }
  .slider { position: relative; height: 32px; touch-action: none; cursor: pointer; }
  .slider .track { position: absolute; left: 0; right: 0; top: 50%; height: 6px; margin-top: -3px; border-radius: 3px; background: var(--glass-2); }
  .slider .fill { position: absolute; left: 0; top: 50%; height: 6px; margin-top: -3px; border-radius: 3px; background: var(--fg); }
  .slider .knob {
    position: absolute; top: 50%; width: 28px; height: 28px; margin: -14px 0 0 -14px; border-radius: 50%;
    background: #fff; box-shadow: 0 2px 10px rgba(0,0,0,.4);
    transition: transform 160ms var(--ease-out);
  }
  .slider.drag .knob { transform: scale(1.12); }

  .seg {
    position: relative; display: grid; grid-template-columns: repeat(var(--n), 1fr);
    height: 38px; border-radius: 12px; background: var(--glass); padding: 3px;
  }
  .seg .pill {
    position: absolute; top: 3px; bottom: 3px; left: 3px;
    width: calc((100% - 6px) / var(--n)); border-radius: 9px; background: var(--glass-2);
    transition: transform 260ms var(--ease-out);
  }
  .seg button { position: relative; font-size: 14px; color: var(--dim); transition: color 200ms ease; }
  .seg button[aria-checked=true] { color: var(--fg); }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

  .actions { display: grid; grid-template-columns: auto 1fr; gap: 12px; margin-top: 6px; }
  .btn {
    height: 52px; border-radius: 16px; padding: 0 18px; font-weight: 600; font-size: 16px;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    transition: transform 160ms var(--ease-out), opacity 200ms ease;
  }
  .btn:active { transform: scale(0.97); }
  .btn:disabled { opacity: .4; }
  .btn.ghost { background: var(--glass); }
  .btn.primary { background: var(--fg); color: #000; }
  .btn svg { width: 20px; height: 20px; }

  .toast {
    position: fixed; left: 50%; top: calc(var(--sat) + 60px); z-index: 20;
    transform: translate(-50%, -12px); opacity: 0;
    padding: 10px 16px; border-radius: 14px; font-size: 14px; max-width: calc(100% - 32px); text-align: center;
    background: rgba(40,40,42,.92); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
    transition: transform 240ms var(--ease-out), opacity 240ms ease;
    pointer-events: none;
  }
  .toast.on { transform: translate(-50%, 0); opacity: 1; }

  @media (prefers-reduced-motion: reduce) {
    .sheet { transition: opacity 200ms ease, visibility 0s; transform: none; opacity: 0; }
    .sheet.open { opacity: 1; }
    .stack .thumb.enter { transform: none; }
  }
  /* short landscape phones: keep it from overflowing */
  @media (max-height: 520px) { .bar { height: 84px; } .shutter { width: 66px; height: 66px; } }
</style>
</head>
<body>
<div id="app">
  <div class="top">
    <button class="chip" id="reset" aria-label="Start over" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
    <div class="brand">loop<b>shot</b></div>
    <button class="chip" id="undo" aria-label="Remove last photo" hidden>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 0 1 0 12h-3"/></svg>
    </button>
  </div>

  <div class="stage">
    <div class="finder" id="finder">
      <video id="video" playsinline muted autoplay></video>
      <div class="flash" id="flash"></div>
      <div class="hint" id="hint">take at least 2</div>
      <div class="gate" id="gate">
        <h1>Snap. Snap. Loop.</h1>
        <p id="gateMsg">take a few photos, get a GIF in your camera roll.</p>
        <button class="go" id="allow">Allow camera</button>
      </div>
    </div>
  </div>

  <div class="bar">
    <div class="stack" id="stack"><div class="count empty" id="count">0</div></div>
    <button class="shutter" id="shutter" aria-label="Take photo" disabled><i></i></button>
    <div class="side" id="side">
      <button class="flip" id="flip" aria-label="Switch camera">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 7h-3l-2-3H9L7 7H4a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h16a1 1 0 0 0 1-1V8a1 1 0 0 0-1-1z"/><path d="M9 13a3 3 0 0 1 5.2-2M15 12.5a3 3 0 0 1-5.2 2"/><path d="M14.5 9.5v1.6h-1.6M9.5 15.6V14h1.6"/></svg>
      </button>
      <button class="done" id="done" aria-label="Make GIF">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
      </button>
    </div>
  </div>
</div>

<div class="sheet" id="sheet" aria-hidden="true">
  <div class="top">
    <button class="chip" id="back" aria-label="Back to camera">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <div class="brand">your <b>loop</b></div>
    <span style="width:36px"></span>
  </div>
  <div class="preview">
    <div class="frame">
      <img id="gif" alt="GIF preview">
      <div class="busy" id="busy"><i></i></div>
      <div class="meta" id="meta"></div>
    </div>
  </div>
  <div class="controls">
    <div class="row">
      <div class="lab"><span>Speed</span><span id="speedVal"></span></div>
      <div class="slider" id="speed" role="slider" tabindex="0" aria-label="Time between photos">
        <div class="track"></div><div class="fill"></div><div class="knob"></div>
      </div>
    </div>
    <div class="two">
      <div class="row">
        <div class="lab"><span>Playback</span></div>
        <div class="seg" id="mode" role="radiogroup" style="--n:2">
          <div class="pill"></div>
          <button role="radio" data-v="loop">Loop</button>
          <button role="radio" data-v="bounce">Bounce</button>
        </div>
      </div>
      <div class="row">
        <div class="lab"><span>Size</span></div>
        <div class="seg" id="size" role="radiogroup" style="--n:3">
          <div class="pill"></div>
          <button role="radio" data-v="240">S</button>
          <button role="radio" data-v="360">M</button>
          <button role="radio" data-v="480">L</button>
        </div>
      </div>
    </div>
    <div class="actions">
      <button class="btn ghost" id="more">+ More</button>
      <button class="btn primary" id="save" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12M7 10l5 5 5-5"/><path d="M5 21h14"/></svg>
        Save to Photos
      </button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { GIFEncoder, quantize, applyPalette } from 'https://unpkg.com/gifenc@1.0.3/dist/gifenc.esm.js';

const $ = (id) => document.getElementById(id);
const video = $('video'), shutter = $('shutter'), side = $('side');
const MAX_SHOTS = 40;
const CAP_W = 480, CAP_H = 640; // stored frame size (3:4)

const state = {
  stream: null,
  facing: 'environment',
  shots: [],            // canvases at CAP_W x CAP_H
  delay: 200,           // ms between frames
  mode: 'loop',
  width: 360,
  file: null,
  url: null,
  job: 0,
};

/* ---------- page lock (belt + braces for mobile webkit) ---------- */
document.addEventListener('touchmove', (e) => e.preventDefault(), { passive: false });
['gesturestart', 'gesturechange', 'gestureend'].forEach((t) => document.addEventListener(t, (e) => e.preventDefault()));
document.addEventListener('dblclick', (e) => e.preventDefault());
document.addEventListener('contextmenu', (e) => { if (e.target.id !== 'gif') e.preventDefault(); });
window.addEventListener('scroll', () => window.scrollTo(0, 0));

/* ---------- toast ---------- */
let toastT;
function toast(msg) {
  const t = $('toast');
  t.textContent = msg; t.classList.add('on');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2400);
}

/* ---------- camera ---------- */
async function startCamera() {
  if (!navigator.mediaDevices?.getUserMedia) {
    $('gateMsg').textContent = 'this browser can’t reach the camera. open it in Safari or Chrome over https.';
    $('allow').hidden = true;
    return;
  }
  stopCamera();
  try {
    state.stream = await navigator.mediaDevices.getUserMedia({
      audio: false,
      video: { facingMode: { ideal: state.facing }, width: { ideal: 1280 }, height: { ideal: 1280 } },
    });
    video.srcObject = state.stream;
    video.classList.toggle('mirror', state.facing === 'user');
    await video.play().catch(() => {});
    $('gate').classList.add('gone');
    shutter.disabled = false;
  } catch (err) {
    const denied = err && (err.name === 'NotAllowedError' || err.name === 'SecurityError');
    $('gateMsg').textContent = denied
      ? 'camera access was blocked. allow it in your browser’s site settings, then tap below.'
      : 'couldn’t start the camera. is another app using it?';
    $('allow').textContent = 'Try again';
    $('allow').hidden = false;
    $('gate').classList.remove('gone');
    shutter.disabled = true;
  }
}
function stopCamera() {
  state.stream?.getTracks().forEach((t) => t.stop());
  state.stream = null;
}
$('allow').addEventListener('click', startCamera);
$('flip').addEventListener('click', () => {
  state.facing = state.facing === 'user' ? 'environment' : 'user';
  startCamera();
});
// iOS kills the track when backgrounded; bring it back
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  const live = state.stream?.getVideoTracks().some((t) => t.readyState === 'live');
  if (!live && $('gate').classList.contains('gone')) startCamera();
});

/* ---------- capture ---------- */
function grab() {
  const vw = video.videoWidth, vh = video.videoHeight;
  if (!vw || !vh) return null;
  const c = document.createElement('canvas');
  c.width = CAP_W; c.height = CAP_H;
  const ctx = c.getContext('2d');
  // center-crop to 3:4, same as the object-fit: cover viewfinder
  const target = CAP_W / CAP_H;
  let sw = vw, sh = vh;
  if (vw / vh > target) sw = vh * target; else sh = vw / target;
  const sx = (vw - sw) / 2, sy = (vh - sh) / 2;
  if (state.facing === 'user') { ctx.translate(CAP_W, 0); ctx.scale(-1, 1); }
  ctx.drawImage(video, sx, sy, sw, sh, 0, 0, CAP_W, CAP_H);
  return c;
}

shutter.addEventListener('click', () => {
  if (state.shots.length >= MAX_SHOTS) { toast(`that’s ${MAX_SHOTS}. plenty.`); return; }
  const c = grab();
  if (!c) return;
  state.shots.push(c);
  const f = $('flash');
  f.classList.add('on'); requestAnimationFrame(() => requestAnimationFrame(() => f.classList.remove('on')));
  navigator.vibrate?.(8);
  addThumb(c);
  renderCount();
});

function addThumb(c) {
  const stack = $('stack');
  const t = document.createElement('div');
  t.className = 'thumb enter';
  t.style.backgroundImage = `url(${c.toDataURL('image/jpeg', 0.6)})`;
  stack.insertBefore(t, $('count'));
  requestAnimationFrame(() => requestAnimationFrame(() => t.classList.remove('enter')));
  // keep the DOM small: only the top 3 are ever visible
  const thumbs = stack.querySelectorAll('.thumb');
  if (thumbs.length > 4) thumbs[0].remove();
}
function rebuildThumbs() {
  $('stack').querySelectorAll('.thumb').forEach((t) => t.remove());
  state.shots.slice(-4).forEach((c) => {
    const t = document.createElement('div');
    t.className = 'thumb';
    t.style.backgroundImage = `url(${c.toDataURL('image/jpeg', 0.6)})`;
    $('stack').insertBefore(t, $('count'));
  });
}
function renderCount() {
  const n = state.shots.length, cnt = $('count');
  cnt.textContent = n;
  cnt.classList.toggle('empty', n === 0);
  cnt.classList.remove('bump'); void cnt.offsetWidth; if (n) cnt.classList.add('bump');
  side.classList.toggle('ready', n >= 2);
  $('reset').hidden = n === 0;
  $('undo').hidden = n === 0;
  $('hint').style.opacity = n >= 2 ? 0 : 1;
  $('hint').textContent = n === 1 ? 'one more' : 'take at least 2';
}
$('undo').addEventListener('click', () => { state.shots.pop(); rebuildThumbs(); renderCount(); });
$('reset').addEventListener('click', () => { state.shots = []; rebuildThumbs(); renderCount(); });

/* ---------- sheet ---------- */
function openSheet() {
  const s = $('sheet');
  s.classList.add('open'); s.setAttribute('aria-hidden', 'false');
  build();
}
function closeSheet() {
  const s = $('sheet');
  s.classList.add('closing'); s.classList.remove('open'); s.setAttribute('aria-hidden', 'true');
  setTimeout(() => s.classList.remove('closing'), 450);
}
$('done').addEventListener('click', () => { if (state.shots.length >= 2) openSheet(); });
$('back').addEventListener('click', closeSheet);
$('more').addEventListener('click', closeSheet);

/* ---------- controls ---------- */
// speed slider: log scale 40ms .. 1000ms, displayed as fps-ish seconds
const SPEED_MIN = 40, SPEED_MAX = 1000;
const toT = (ms) => Math.log(ms / SPEED_MIN) / Math.log(SPEED_MAX / SPEED_MIN);
const fromT = (t) => Math.round((SPEED_MIN * Math.pow(SPEED_MAX / SPEED_MIN, t)) / 10) * 10; // gif delays are in 10ms units
function paintSpeed() {
  const el = $('speed'), t = toT(state.delay);
  el.querySelector('.fill').style.width = `${t * 100}%`;
  el.querySelector('.knob').style.left = `${t * 100}%`;
  el.setAttribute('aria-valuenow', state.delay);
  el.setAttribute('aria-valuetext', `${state.delay} milliseconds`);
  $('speedVal').textContent = state.delay < 1000 ? `${(state.delay / 1000).toFixed(2).replace(/^0/, '')}s / frame` : '1s / frame';
}
(function bindSlider() {
  const el = $('speed');
  let active = false;
  const setFromX = (x) => {
    const r = el.getBoundingClientRect();
    const t = Math.min(1, Math.max(0, (x - r.left) / r.width));
    const v = fromT(t);
    if (v !== state.delay) { state.delay = v; paintSpeed(); schedule(); }
  };
  el.addEventListener('pointerdown', (e) => { active = true; el.setPointerCapture(e.pointerId); el.classList.add('drag'); setFromX(e.clientX); });
  el.addEventListener('pointermove', (e) => { if (active) setFromX(e.clientX); });
  const end = () => { active = false; el.classList.remove('drag'); };
  el.addEventListener('pointerup', end); el.addEventListener('pointercancel', end);
  el.addEventListener('keydown', (e) => {
    const step = { ArrowLeft: -0.05, ArrowDown: -0.05, ArrowRight: 0.05, ArrowUp: 0.05 }[e.key];
    if (step == null) return;
    e.preventDefault();
    state.delay = fromT(Math.min(1, Math.max(0, toT(state.delay) + step)));
    paintSpeed(); schedule();
  });
})();

function bindSeg(id, key, parse) {
  const seg = $(id), btns = [...seg.querySelectorAll('button')], pill = seg.querySelector('.pill');
  const paint = () => {
    btns.forEach((b, i) => {
      const on = parse(b.dataset.v) === state[key];
      b.setAttribute('aria-checked', on);
      if (on) pill.style.transform = `translateX(${i * 100}%)`;
    });
  };
  btns.forEach((b) => b.addEventListener('click', () => {
    const v = parse(b.dataset.v);
    if (v === state[key]) return;
    state[key] = v; paint(); schedule();
  }));
  paint();
}
bindSeg('mode', 'mode', String);
bindSeg('size', 'width', Number);
paintSpeed();

/* ---------- encode ---------- */
let schedT;
function schedule() {
  clearTimeout(schedT);
  if (!$('sheet').classList.contains('open')) return;
  schedT = setTimeout(build, 180);
}
const nextFrame = () => new Promise((r) => setTimeout(r, 0));

async function build() {
  const job = ++state.job;
  const n = state.shots.length;
  if (n < 2) return;
  $('busy').classList.add('on');
  $('save').disabled = true;

  const w = state.width, h = Math.round(w * CAP_H / CAP_W);
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  const ctx = c.getContext('2d', { willReadFrequently: true });
  ctx.imageSmoothingQuality = 'high';

  // scale every shot once
  const frames = [];
  for (const s of state.shots) {
    ctx.drawImage(s, 0, 0, w, h);
    frames.push(ctx.getImageData(0, 0, w, h).data);
  }
  await nextFrame(); if (job !== state.job) return;

  // one shared palette across all frames, so colors don't shimmer between shots
  const px = w * h, stride = Math.max(1, Math.floor((px * n) / 250000));
  const sample = new Uint8ClampedArray(Math.ceil(px / stride) * n * 4);
  let o = 0;
  for (const f of frames) for (let i = 0; i < px; i += stride, o += 4) {
    sample[o] = f[i * 4]; sample[o + 1] = f[i * 4 + 1]; sample[o + 2] = f[i * 4 + 2]; sample[o + 3] = 255;
  }
  const palette = quantize(sample.subarray(0, o), 256);

  const order = frames.map((_, i) => i);
  if (state.mode === 'bounce') for (let i = n - 2; i >= 1; i--) order.push(i);

  const indexed = [];
  for (const f of frames) {
    indexed.push(applyPalette(f, palette));
    await nextFrame(); if (job !== state.job) return;
  }
  const gif = GIFEncoder();
  order.forEach((i, k) => {
    gif.writeFrame(indexed[i], w, h, k === 0 ? { palette, delay: state.delay, repeat: 0 } : { delay: state.delay });
  });
  gif.finish();
  if (job !== state.job) return;

  const blob = new Blob([gif.bytes()], { type: 'image/gif' });
  if (state.url) URL.revokeObjectURL(state.url);
  state.url = URL.createObjectURL(blob);
  const stamp = new Date().toISOString().slice(0, 19).replace(/[-:T]/g, '');
  state.file = new File([blob], `loopshot-${stamp}.gif`, { type: 'image/gif' });
  $('gif').src = state.url;
  const kb = blob.size / 1024;
  $('meta').textContent = `${order.length} frames · ${kb > 1024 ? (kb / 1024).toFixed(1) + ' MB' : Math.round(kb) + ' KB'}`;
  $('busy').classList.remove('on');
  $('save').disabled = false;
}

/* ---------- save ---------- */
$('save').addEventListener('click', async () => {
  const file = state.file;
  if (!file) return;
  // the share sheet is the only path into Photos from the web: "Save Image" lands it in the camera roll
  if (navigator.canShare?.({ files: [file] })) {
    try { await navigator.share({ files: [file] }); return; }
    catch (e) { if (e.name === 'AbortError') return; }
  }
  const a = document.createElement('a');
  a.href = state.url; a.download = file.name;
  document.body.appendChild(a); a.click(); a.remove();
  toast('downloaded. on iPhone you can also long-press the GIF → Save to Photos.');
});

renderCount();
startCamera();
</script>
</body>
</html>
